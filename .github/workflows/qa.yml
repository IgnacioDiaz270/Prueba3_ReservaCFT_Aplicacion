name: QA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: |
          dotnet restore src/ReservaCFT.Web/ReservaCFT.Web.csproj
          dotnet restore tests/ReservaCFT.Tests/ReservaCFT.Tests.csproj

      - name: Compilar
        run: dotnet build src/ReservaCFT.Web/ReservaCFT.Web.csproj --configuration Release --no-restore

      - name: Pruebas unitarias
        run: dotnet test tests/ReservaCFT.Tests/ReservaCFT.Tests.csproj --configuration Release
