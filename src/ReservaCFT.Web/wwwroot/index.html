<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserva de espacios CFT</title>
<style>body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;background:#f5f7fa}main{background:white;padding:28px;border-radius:12px;box-shadow:0 2px 12px #0002}label{display:block;margin-top:14px;font-weight:600}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin-top:6px}button{margin-top:20px;background:#1f4e78;color:white;border:0;border-radius:6px;font-weight:700;cursor:pointer}#resultado{margin-top:20px;padding:12px;border-radius:6px;background:#eef3f8;min-height:24px}</style>
</head>
<body>
<main>
<h1>Reserva de espacios CFT</h1>
<label for="nombre">Nombre responsable</label>
<input id="nombre" type="text">
<label for="tipo">Tipo de espacio</label>
<select id="tipo"><option value="Sala">Sala</option><option value="Auditorio">Auditorio</option></select>
<label for="horas">Horas</label>
<select id="horas"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
<button id="btnReservar">Reservar</button>
<div id="resultado"></div>
</main>
<script>
const resultado=document.getElementById('resultado');
document.getElementById('btnReservar').addEventListener('click', async()=>{
 resultado.textContent='Procesando...';
 const body={nombre:document.getElementById('nombre').value,tipo:document.getElementById('tipo').value,horas:Number(document.getElementById('horas').value)};
 const r=await fetch('/api/reservas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const data=await r.json();
 await new Promise(res=>setTimeout(res,500));
 if(r.ok){resultado.textContent=`Reserva confirmada. Total: $${Number(data.total).toLocaleString('es-CL')}`;}
 else{resultado.textContent=data.error || 'Error de reserva';}
});
</script>
</body>
</html>
